services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    networks:
      - inception
    volumes:
      - db:/var/lib/mysql
    secrets:
      - db_pass
      - db_root_pass
    env_file:
      - .env

  wordpress:
    build: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    networks:
      - inception
    volumes:
      - press:/var/www/html
    depends_on:
      - mariadb
    secrets:
      - wp_pass
      - db_pass
      - user_pass
    env_file:
      - .env

  nginx:
    build:
      context: ./requirements/nginx
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}

    image: nginx
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - press:/var/www/html
    depends_on:
      - wordpress
    networks:
      - inception
    env_file:
      - .env

volumes:
  db:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  press:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

secrets:
  db_pass:
    file: ../secrets/db_pass.txt
  db_root_pass:
    file: ../secrets/db_root_pass.txt
  wp_pass:
    file: ../secrets/wp_pass.txt
  user_pass:
    file: ../secrets/user_pass.txt

networks:
  inception: