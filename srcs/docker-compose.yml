

services:
  mariadb:
    build: ./requirements/mariadb/.
    container_name: mariadb
    restart: always
    networks:
      - inception
    volumes:
      - db:/var/lib/mysql
    secrets:
      - db_pass
      - wp_pass
    env_file: 
      - .env

  wordpress:
    build: ./requirements/wordpress/.
    container_name: wordpress
    restart: always
    networks:
      - inception
    volumes:
      - press:/var/www/html
    depends_on:
      - mariadb
    secrets:
      - wp_pass
      - db_pass
      - user_pass
    env_file: 
      - .env  
    
  nginx:
    build: ./requirements/nginx/.
    container_name: nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - press:/var/www/html
    depends_on:
      - mariadb
      - wordpress
    networks:
      - inception
    env_file: 
      - .env

volumes:
  db:
    driver_opts:
      type: none
      o: bind
      device: /home/francisco/data/mariadb
  press:
    driver_opts:
      type: none
      o: bind
      device: /home/francisco/data/wordpress

secrets:
  db_pass:
    file: ../secrets/db_pass.txt
  wp_pass:
    file: ../secrets/wp_pass.txt
  user_pass:
    file: ../secrets/user_pass.txt


networks:
  inception: